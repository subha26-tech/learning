    <section id="mp10">
        <h2>Advanced Filterable Form</h2>
        <form>

            <label for="date">Select Date:</label><br>
            <input type="date" id="date" name="date" required><br><br>

            <label for="price">Price Range (100-1000):</label><br>
            <input type="range" id="price" name="price" min="100" max="1000" value="200"><br><br>

            <label for="city">City:</label><br>
            <input list="cities" id="city" name="city" placeholder="Enter city" required>
            <datalist id="cities">
                <option value="Chennai">
                <option value="Mumbai">
                <option value="Delhi">
                <option value="Bangalore">
                <option value="Hyderabad">
                <option value="Kolkata">
            </datalist>
            <br><br>

            <input type="submit" value="Submit">

        </form>
    </section>
