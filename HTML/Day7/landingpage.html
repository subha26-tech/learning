<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #333;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    main {
      flex: 1;
      padding: 2rem;
      background-color: #f4f4f4;
    }

    footer {
      background-color: #333;
      color: #fff;
      padding: 1rem;
      text-align: center;
      position: sticky;
      bottom: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Landing Page</h1>
  </header>

  <main>
    <h2>Main Content Area</h2>
    <p>This is where your core content goes. You can add text, images, or even sections for features, testimonials, or calls to action.</p>
  </main>

  <footer>
    <p>&copy; 2026 My Website | All Rights Reserved</p>
  </footer>
</body>
</html>
