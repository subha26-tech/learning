<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Homepage</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    nav { background: #333; padding: 1em; }
    nav a { color: white; margin: 0 1em; text-decoration: none; }
    main { padding: 2em; background: #f4f4f4; }
    aside { padding: 2em; background: #ddd; }
    h1, h2 { margin-top: 0; }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </nav>

  <!-- Featured Section -->
  <main>
    <h1>Welcome to Our Homepage</h1>
    <p>This is the featured section where you can highlight your main content, promotions, or announcements.</p>
  </main>

  <!-- Newsletter Block -->
  <aside>
    <h2>Subscribe to Our Newsletter</h2>
    <form>
      <label for="email">Email Address:</label><br>
      <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
      <button type="submit">Subscribe</button>
    </form>
  </aside>

</body>
</html>
