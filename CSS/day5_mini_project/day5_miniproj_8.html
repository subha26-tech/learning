<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter Signup Banner</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            font-family: Arial, sans-serif;
        }
        .banner{
            width:100vw;
            height: 60vh;
            /* background:#4A90E2;
            color:white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; */
            background-image:url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQkZRvXy34s5G6g7I8KeIV6OWPX5lYTx22rnqvNeshDAw&s=10");
            background-size:cover;
            background-position:center;
        }
         .overlay{
            width:100%;
            height:100%;
            background:rgba(0, 0, 0, 0.5);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            flex-direction: column;
        }
        .overlay h1{
            color:white;
            font-size:3.5vw;
            text-shadow:3px 3px 6px rgba(0,0,0,0.2);
            margin-bottom:35px;
        }
        .overlay p{
            font-size:1.5vmax;
            margin-bottom:35px;
        }
        .signup-form{
            width:60%;
            display: flex;
        }
        .signup-form input{
            flex: 1;
            padding:0.8em;
            font-size:1vmax;
            border:none;
            outline: none;
            border-radius:5px;
        }
        .signup-form button{
            padding:12px 20px;
            margin-left:10px;
            font-size:1vmax;
            background:#fa9417;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }
        .signup-form button:hover{
            background:#f26828;
        }
        .note{
            font-size:2vmin;
            margin-top:2vmin;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="overlay">
            <h1>Subscribe to Our Newsletter</h1>
            <p>Get the latest updates and exclusive offers delivered to your inbox.</p>
            <form class="signup-form">
                <input type="email" placeholder="Enter your email" required>
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>
</body>
</html>
