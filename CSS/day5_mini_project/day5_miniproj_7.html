<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form Section</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .contact-section {
            height: 100vh;
            background:radial-gradient(ellipse,#764ba2,#667eea,#764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .contact-container {
            width: 30%;
            max-width: 900px;
            background: whitesmoke;
            box-shadow: 0px 0px 10px rgb(222, 86, 86);
            padding: 30px;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        .contact-form {
            flex: 1;
            min-width: 280px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        p.instructions {
            font-size: 1em;
            margin-bottom: 20px;
            color: #666;
        }
        label {
            display: block;
            font-size: 1rem;
            margin-bottom: 5px;
        }
        input,
        textarea {
            width: 100%; 
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        input:focus, textarea:focus{
            border-color: #2193b0;
            box-shadow: 0 0 8px rgba(33, 147, 176, 0.5);
        }
        button {
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        @media (max-width: 768px) {
            .contact-container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<section class="contact-section">
    <div class="contact-container">
        <div class="contact-form">
            <h2>Contact Us</h2>
            <p class="instructions">Please fill out the form below and we'll get back to you soon.</p>
            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
                <label for="message">Message</label>
                <textarea id="message" placeholder="Write your message"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
</section>

</body>
</html>
