<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Hero Section</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }
        .hero{
            height:100vh;
            background-image:url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREOqD29Ok6kI36FokBDtUDucn63jKW9CULovHwpUi9dQ&s=10");
            background-size:cover;
            background-position:center;
            display:flex;
            justify-content:center;
            text-align:center;
            color:white;
        }
        .hero-content h1{
            font-size:60px;
            text-shadow:3px 3px 6px rgba(0,0,0,0.8);
            margin:30px 0px;
        }
        .hero-content button{
            padding:15px 30px;
            font-size:18px;
            border:none;
            border-radius:5px;
            background:#ff6600;
            color:white;
            cursor:pointer;
            box-shadow:0 5px 15px rgba(0,0,0,0.5);
            transition:0.3s;
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to Our Website</h1>
            <button>Get Started</button>
        </div>
    </section>
</body>
</html>
