<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Landing Page</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#050816;
            color:white;
            text-align:center;
        }
        button{
            margin-top:30px;
            padding:15px 40px;
            border:none;
            background:#00f7ff;
            font-size:18px;
            font-weight: bold;
            border-radius:50px;
            cursor:pointer;
            box-shadow:0 0 20px #00f7ff;
        }
        h1{
            font-size: 80px;
            text-shadow:0 0 20px #00f7ff;
        }
    </style>
</head>
<body>
    <section id="container">
            <div class="content">
                <h1>Design Creative Website</h1>   
                <p>Design. Develop. Deliver</p>            
                <button>Start Now</button>
            </div>
    </section>
</body>
</html>
