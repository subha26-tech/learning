<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            font-family:Verdana, sans-serif;
            background:linear-gradient(100deg,#764ba2,#667eea,#764ba2);
            padding:40px;
        }
        .container{
            display:flex;
            justify-content:center;
            gap:25px;
        }
        .card{
            width:30%;      
            background:#fff;
            border-radius:15px;
            padding:25px;
            text-align:center;
            border:2px solid #ddd;
            transition:0.3s;
        }
        .card:hover{
            transform:translateY(-10px);
            box-shadow:0 8px 15px rgba(0,0,0,0.2);
        }
        h2{
            color:#444444;
            margin-bottom:15px;
        }
        .price{
            font-size:5vmin; 
            color:#4601f5;
            font-weight:bold;
            margin-bottom:20px;
        }
        ul{
            list-style:none;
        }
        ul li{
            font-size:1.2rem;  
            padding:10px;
            color:#555555;
        }
        .btn{
            margin-top:20px;
            padding:10px 25px;
            border:none;
            border-radius:20px;
            background:#4601f5;
            color:white;
            cursor:pointer;
            font-size:16px;
        }
        .btn:hover{
            background:#9422c9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Basic</h2>
            <div class="price">$10</div>
            <ul>
                <li>✔ 5 GB Storage</li>
                <li>✔ Email Support</li>
                <li>✔ 1 User</li>
            </ul>
            <button class="btn">Buy Now</button>
        </div>
        <div class="card">
            <h2>Pro</h2>
            <div class="price">$25</div>
            <ul>
                <li>✔ 50 GB Storage</li>
                <li>✔ Priority Support</li>
                <li>✔ 5 Users</li>
            </ul>
            <button class="btn">Buy Now</button>
        </div>
        <div class="card">
            <h2>Premium</h2>
            <div class="price">$50</div>
            <ul>
                <li>✔ Unlimited Storage</li>
                <li>✔ 24/7 Support</li>
                <li>✔ Unlimited Users</li>
            </ul>
            <button class="btn">Buy Now</button>
        </div>
    </div>
</body>
</html>
