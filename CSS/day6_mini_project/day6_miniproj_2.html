<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Section</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            
        }
        body{
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: rgb(244, 243, 243);
        }
        header{
            flex: 1;
            background-color: rgb(239, 111, 51);
            padding: 20px;
            color: white;
            text-align: center;
        }
         header h1{
            font-size:42px;
        }
        header p, section p{
            font-size: 1em;
            color: #565656;
        }
        section{
            flex: 3;
            padding: 20px;
            margin: 25px;
            border: 2px solid #f4f2f2;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0px 0px 15px rgb(146, 146, 145);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        footer{
            background:#222222;
            padding: 20px;
            color: white;
            text-shadow: 2px 2px 5px #000000;
            text-align: center;
        }
        h2{
            font-size: 2rem;
            margin: 20px 0px;
        }
        img{
            border-radius: 100%;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Landing Page</h1>
        <p>Discover amazing features and services</p>
    </header>
    <section>
        <img src="https://www.vetriit.com/assets/logo-05w9K429.jpg" alt="Vetri">
        <h2>Why Choose Us ?</h2>
        <p>We provide high-quality services to help you grow your business.</p>
    </section>
    <footer>
        <p>&copy; 2025 Vetri Technology Solutions. All Rights Reserved.</p>
    </footer>
</body>
</html>
