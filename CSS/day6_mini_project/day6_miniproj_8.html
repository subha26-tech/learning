<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Comparison Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 40px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        table {
            width: 70%;
            margin: 30px auto;  
            border-collapse: collapse;
            background-color: white;
        }
        th {
            background-color: #007BFF;
            color: white;
            padding: 12px;
            border: 1px solid #ddd;
        }
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        .yes {
            background-color: #d4edda; /* Light Green */
            color: #155724;
            font-weight: bold;
        }
        .no {
            background-color: #f3e1c1; /* Light Red */
            color: #ea3e13;
            font-weight: bold;
        }
        .feature {
            background-color: #f2f2f2;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Feature Comparison Table</h2>
    <table>
        <tr>
            <th>Feature</th>
            <th>Caresmith Professional Cordless Dental Flosser</th>
            <th>ORACURA Smart PLUS Water Flosser OC200 LITE</th>
        </tr>
        <tr>
            <td class="feature">Price</td>
            <td>$499</td>
            <td>$599</td>
        </tr>
        <tr>
            <td class="feature">Tank Capacity</td>
            <td class="yes">300</td>
            <td class="no">200</td>
        </tr>
        <tr>
            <td class="feature">Modes</td>
            <td class="yes">3 Working Modes</td>
            <td class="no">4 Working Modes</td>
        </tr>
        <tr>
            <td class="feature">Battery Life</td>
            <td class="yes">20 days</td>
            <td class="no">10 - 15 days</td>
        </tr>
        <tr>
            <td class="feature">Warranty</td>
            <td>2 Years</td>
            <td>1 Year</td>
        </tr>
    </table>

</body>
</html>
