<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        .team-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            width: 250px;
            margin: 15px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
        }
        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        .card h2 {
            color: #222;
            margin-bottom: 8px;
        }
        .card p {
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Our Team</h1>
    <div class="team-container">
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTArpiQnN6uIDZxd6TTWLPsuLclAPjqiVmmHSwxv9yMaw&s=10" alt="Member 1">
            <h2>Joseph M</h2>
            <p>Project Manager</p>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRM7DiXOdxSqBr_d2jHt1858dRguwex-t-C6bcumfeBDA&s=10" alt="Member 2">
            <h2>Susan A</h2>
            <p>UI/UX Designer</p>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRqpXLuPy5KlvwYycmQRJx4uNfGIjeL-b6YYx9nN1B1NA&s=10" alt="Member 3">
            <h2>Michael B</h2>
            <p>Frontend Developer</p>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSQwZucS0NzU4BWc1AanV-bLf_xG4omx3dlK8i4qaNEw&s=10" alt="Member 4">
            <h2>David D</h2>
            <p>Backend Developer</p>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQK4f5LBbB9fiPPHlt82UwMJNqCs5VQ0oVhe5lnhWRUHg&s=10" alt="Member 5">
            <h2>Christopher W</h2>
            <p>QA Engineer</p>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQe4X2tGuNWz6UBekSvkRrCgehhBT0bq-FJP-Uxzk0Dkg&s=10" alt="Member 6">
            <h2>Anthony T</h2>
            <p>Marketing Manager</p>
        </div>
    </div>

</body>
</html>
