<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call-to-Action (CTA) Section</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, sans-serif;
        }
        .cta {
            height: 100vh;
            background: linear-gradient(300deg,royalblue, rgb(2, 188, 221),royalblue);
            text-align: center;
            color: white;
            padding: 15rem 10rem;
        }
        .cta h1{
            font-size: 3rem;
            margin-bottom: 3rem;
        }
        .cta p{
            font-size: 1.25rem;
            margin-bottom: 3rem;
        }
        .btn{
            border: none;
            border-radius: 5px;
            background-color: #f4f4f4;
            color: midnightblue;
            padding: 1em 2em;
            font-size: 1.2rem;
        }
        .btn:hover{
            background-color: midnightblue;
            color: #f4f4f4;
        }
    </style>
</head>
<body>
    <div class="cta">
        <h1>Built for SMEs and Start-ups</h1>
        <p>Whether you're a fast-growing startup or an established SME, our solution adapts to your needs. Start with simple uploads and scale to ERP/CRM integrations in the future.</p>
        <button class="btn">Get Started  &LongRightArrow;</button>
    </div>
</body>
</html>
