<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units Example</title>

   <style>
        /*Task 14*/
        nav {
            padding: 20px;
            background-color: lightblue;
        }
        /*Task 15*/
        .box {
            width: 10cm;
            background-color: lightgreen;
        }
        /*Task 16*/
        .container {
            height: 300px;
        }
        .container img {
            height: 100%;
        }
        /*Task 17*/
        .parent {
            font-size: 20px;
        }
        .parent p {
            font-size: 1.5em;
        }
        /*Task 18*/
        h2 {
            margin: 2rem;
        }
        /*Task 19*/
        #t_19_h1{
            font-size: 8vw;
        }
        /*Task 20*/
        header {
            margin-top: 10vh;
            background-color: lightgray;
        }
        /*Task 21*/
        .banner {
            font-size: 4vmin;
            padding: 3vmin;
            background-color: orange;
        }
        /*Task 22*/
        .icon {
            width: 80px;
            height: 80px;
            background: teal;
            color: white;
            text-align: center;
            line-height: 80px;
            border-radius: 50vmax;
        }
        /*Task 23*/
        button {
            padding: 1rem 2rem;
            font-size: 1.2em;
        }
        /*Task 24*/
        #t_24_img {
            width: 100%;
            max-width: 700px;
        }
        /*Task 25*/
        .hero {
            height: 70vh;
            border: 3px solid black;
            background-color: lightcoral;
        }
        /*Task 26*/
        .layout {
            width: 80%;
            padding: 2rem;
            background-color: rgb(252, 252, 191);
        }
        .layout p {
            font-size: 1.5em;
        }
   </style>
</head>
<body>
    <h1>Task 14</h1>
    <nav>Home | About | Contact</nav>
    <h1>Task 15</h1>
    <div class="box">Box</div>
    <h1>Task 16</h1>
    <div class="container">
        <img src="https://picsum.photos/id/1025/600/400" alt="Image">
    </div>
    <h1>Task 17</h1>
    <div class="parent">
        <p>This text scales with the parent.</p>
    </div>
    <h1>Task 18</h1>
    <h2>Heading</h2>
    <h1>Task 19</h1>
    <h1 id="t_19_h1">Responsive Heading</h1>
    <h1>Task 20</h1>
    <header>Welcome</header>
    <h1>Task 21</h1>
    <div class="banner">Responsive Banner</div>
    <h1>Task 22</h1>
    <div class="icon">★</div>
    <h1>Task 23</h1>
    <button>Click Me</button>
    <h1>Task 24</h1>
    <img id="t_24_img" src="https://picsum.photos/id/1025/600/400" alt="Image">
    <h1>Task 25</h1>
    <section class="hero">
        <h3>Hero Section</h3>
    </section>
    <h1>Task 26</h1>
    <div class="layout">
        <p>Responsive Layout Example</p>
    </div>
</body>
</html>
