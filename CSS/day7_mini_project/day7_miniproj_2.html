<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Login Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #4ba9d0, #79edef);
            font-family: Arial, sans-serif;
        }
        .login-container {
            width: 410px;
            padding: 48px 25px 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 42px;
            color: #111111;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 18px;
            outline: none;
        }
        input::placeholder {
            color: #888888;
        }
        input:focus {
            border-color: #4a90e2;
        }
        button {
            width: 100%;
            height: 47px;
            border: none;
            border-radius: 5px;
            background: #4a90e2;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover {
            background: #397fcf;
        }
    </style>
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>
    <form>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button>Login</button>
    </form>
  </div>
</body>
</html>
