<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Login & Signup</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }
        body{
            min-height:100vh;
            display:flex;
            flex-direction: column;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe,#6a11cb);
            background-size:300% 300%;
            padding:20px;
        }
        .container{
            width:100%;
            max-width: 1000px;
            display:flex;
            gap:150px;
        }
        .form-box{
            flex:1;
            padding:50px;
            color:#fff;            
            background-color:rgba(255,255,255,.15);
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 40px rgba(0,0,0,.25);
        }
        form{
            display:flex;
            flex-direction:column;
            justify-content: space-between;
        }
        .form-box h2{
            text-align:center;
            margin-bottom:30px;
            font-size:32px;
        }
        input{
            margin-bottom:18px;
            padding:14px;
            border:none;
            border-radius:10px;
            outline:none;
            font-size:16px;
            background:rgba(255,255,255,.25);
            color:#ffffff;
            transition:.3s;
        }
        input::placeholder{
            color:#eeeeee;
        }
        input:focus{
            background:#ffffff;
            color:#333333;
            transform:scale(1.02);
            box-shadow:0 0 15px rgba(255,255,255,.8);
        }
        button{
            padding:10px;
            border:none;
            border-radius:10px;
            background:rgb(248, 239, 239);
            color:#434242;
            font-size:17px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:#222222;
            color:#ffffff;
        } 
        p{
            text-align:center;
            margin-top:18px;
            cursor:pointer;
        } 
    </style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>Login</h2>
            <form>
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p>Forgot Password?</p>
            </form>
        </div>
        <div class="form-box">
            <h2>Create Account</h2>
            <form>
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>
</body>
</html>
