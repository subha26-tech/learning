<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Pricing Table</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pricing-container {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: stretch;
            width: 90%;
            max-width: 1000px;
        }
        .pricing-card {
            background-color: white;
            padding: 35px 25px;
            width: 30%;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }
        .pricing-card h2 {
            margin-bottom: 15px;
            color: #333;
        }
        .price {
            font-size: 35px;
            font-weight: bold;
            color: #222;
            margin-bottom: 20px;
        }
        .pricing-card ul {
            list-style: none;
            margin-bottom: 25px;
        }
        .pricing-card li {
            padding: 8px;
            color: #555;
        }
        .btn{
            margin-top:20px;
            padding:10px 25px;
            border:none;
            border-radius:20px;
            background:#4601f5;
            color:white;
            cursor:pointer;
            font-size:16px;
        }
        .featured {
            background: linear-gradient(300deg, #602f02, #fe8401,yellow,#fe8401,#602f02);
            transform: scale(1.05);
        }
        .featured h2,
        .featured .price,
        .featured li {
            color: rgb(25, 2, 116);
        }
        .featured .btn {
            background-color: rgb(227, 247, 7);
            color: rgb(25, 2, 116);
        }
        @media (max-width: 768px) {
            .pricing-container {
                flex-direction: column;
                align-items: center;
            }
            .pricing-card {
                width: 80%;
            }
            .featured {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="pricing-container">
        <div class="pricing-card">
            <h2>Basic</h2>
            <div class="price">$10</div>
            <ul>
                <li>✔ 5 GB Storage</li>
                <li>✔ Email Support</li>
                <li>✔ 1 User</li>
            </ul>
            <button class="btn">Buy Now</button>
        </div>
        <div class="pricing-card featured">
            <h2>Pro</h2>
            <div class="price">$25</div>
            <ul>
                <li>✔ 50 GB Storage</li>
                <li>✔ Priority Support</li>
                <li>✔ 5 Users</li>
            </ul>
            <button class="btn">Buy Now</button>
        </div>
        <div class="pricing-card">
            <h2>Premium</h2>
            <div class="price">$50</div>
            <ul>
                <li>✔ Unlimited Storage</li>
                <li>✔ 24/7 Support</li>
                <li>✔ Unlimited Users</li>
            </ul>
            <button class="btn">Buy Now</button>
        </div>
    </div>
</body>
</html>
