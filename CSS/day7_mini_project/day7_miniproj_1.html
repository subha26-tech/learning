<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial', cursive;
        } 
        html,body{
            height: 100%;
            margin:0;
        }
        body{
            min-height: 100vh;
            background: url("https://images.unsplash.com/photo-1533135404995-a618910b7b6f?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fG1vdW50YWluJTIwYWR2ZW50dXJlfGVufDB8fDB8fHww");
            background-repeat: no-repeat;
            background-size: cover;
        }       
        nav{
            background-color: #013b54;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 80px;
        }
        nav a{
            display: inline-block;
            text-decoration: none;
            font-size: large;
            font-weight: bold;
            color: white;
            padding-right: 15px;
            transition: transform 0.3s ease;
            text-transform: uppercase;
        }   
        h1{
            font-size: 2rem;
            font-style: italic;
        }     
        .home::before{
            content:"🏠 ";
        }
        .about::before{
            content:"👤 ";
        }
        .services::before{
            content:"⚙️ ";
        }
        .extlink::before{
            content: "🔗 ";
        }
        .contact::before{
            content:"📞 ";
        }
        nav a:hover{
            color: #e8c606;
            transform: scale(1.1);
        }
        .logo {
            font-family: 'Lobster', cursive;
            font-size: 60px;
            color: #e8c606;
            width: 45%;
            text-align: left !important;
            text-shadow:
                3px 3px 0 #222,
                5px 5px 10px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body>
    <nav>
        <a href="#" class="home">Home</a>
        <a href="#" class="about">About</a>
        <a href="#" class="services">Services</a>
        <a href="#" class="extlink">Gallery</a>
        <a href="#" class="contact">Contact</a>
    </nav>
</body>
</html>
