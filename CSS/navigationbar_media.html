<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navigation Bar</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        } 
        html,body{
            height: 100%;
            margin:0;
        }
        body{
            min-height: 100vh;
            background-color: white;
        }       
        header{
            background-color: #013b54;
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 20px; 
            position: relative;
        }
        nav {
            width: 60%;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            gap: 50px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bolder;
            padding-right: 30px;
        }
        .logo {
            font-family: 'Lobster', cursive;
            font-size: 60px;
            color: #e8c606;
            text-align: left !important;
            text-shadow:
                3px 3px 0 #222,
                5px 5px 10px rgba(0, 0, 0, 0.35);
        }
        .btn{
            background-color: #e8c606;
            border: 1px solid #e8c606;
            color: whitesmoke;
            font-weight: bold;
            padding: 5px 30px;
            cursor: pointer;
        }
        .nav-links a:hover{
            font-size: 20px;
            color: #e8c606;
        }
        .btn:hover{
            font-size: 18px;
        }
        .menu, .close{
            display: none;
        }
        /* Responsive design */
        @media (max-width: 768px) {
           nav, .close{
                display: none;
           }
           .menu-btn{
                padding: 10px 15px;
                font-size: 30px;
                color: white;
                cursor: pointer;
            }
            .menu{
                display: block;
            }
            #menu-toggle:checked ~ .menu{
                display: none;
            }
            #menu-toggle:checked ~ .close{
                display: block;
            }
            #menu-toggle:checked ~ nav { 
                display: flex; 
                flex-direction: column; 
                align-items: center;
                width: 100%; 
                position: absolute; 
                top: 100%; 
                left: 0; 
                background-color: #013b54; 
                padding: 20px 0; 
            }
            #menu-toggle:checked ~ nav .nav-links{
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
             #menu-toggle:checked ~ nav .btn{
                display: block;

             }

        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Adventure</div>
        <input type="checkbox" id="menu-toggle" style="display: none;">
        <label for="menu-toggle" class="menu-btn menu">☰</label>
        <label for="menu-toggle" class="menu-btn close">✕</label>
        <nav>
            <div class="nav-links">
                <a href="#" class="home">Home</a>
                <a href="#" class="about">About</a>
                <a href="#" class="services">Services</a>
                <a href="#" class="extlink">Gallery</a>
                <a href="#" class="contact">Contact</a>
            </div>
            <button type="button" class="btn">Login</button>
        </nav>
    </header>
</body>
</html>
