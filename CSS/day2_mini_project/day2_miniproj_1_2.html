<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Mini Project 1 and 2</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Georgia, 'Times New Roman', Times, serif
        } 
        html,body{
            height: 100%;
            margin:0;
        }
        body{
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }       
        header{
            background:linear-gradient(60deg,rgba(255, 255, 0,0.5),rgba(0, 0, 255,0.5),rgba(255, 255, 0,0.5));
            display: flex;
            flex-direction: column;
            text-align: center;
            justify-content: space-between;
        }
        nav a[href]{
            display: inline-block;
            text-decoration: none;
            font-size: larger;
            color: white;
            padding-right: 15px;
            transition: transform 0.3s ease;
        }        
        .home::before{
            content:"🏠 ";
        }
        .about::before{
            content:"👤 ";
        }
        .services::before{
            content:"⚙️ ";
        }
        .extlink::before{
            content: "🔗 ";
        }
        .contact::before{
            content:"📞 ";
        }
        nav a[href]:hover{
            color: #0aef5a;
            transform: scale(1.1);
        }
        main{
            flex:1;
            background-color: rgb(241, 240, 240);
        }
        section{
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle,rgba(27, 171, 228, 0.9),rgb(252, 250, 250));/*rgb(191, 225, 243)*/
            text-align: center;
        }
        #sec1 h2{
            color: blue;
            margin-bottom: 0px;
        }
        .btn{
            background-color: rgb(35, 206, 146);
            color: white;
        }   
    </style>
</head>
<body>
    <header>
        <h1>Welcome to our page</h1>
        <nav>
            <a href="#" class="home">Home</a>
            <a href="#" class="about">About</a>
            <a href="#" class="services">Services</a>
            <a href="#" class="extlink">External Link</a>
            <a href="#" class="contact">Contact</a>
        </nav>
    </header>
    <main>
        <section id="sec1">
            <h2>Product Name</h2>
            <p>This is an amazing product that you will love.</p>
            <button class="btn">Buy Now</button>
        </section>
    </main>
</body>
</html>
