<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Mini Project 6</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        section {
            width: 80%;
            margin: 40px auto;
            text-align: center;
        }
        section h2 {
            margin-bottom: 30px;
            color: #333;
        }
        .testimonials {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        figure {
            background: rgba(0, 123, 255, 0.15);
            padding: 20px;
            border-radius: 10px;
            width: 30%;
            min-width: 250px;
            margin: 0;
            transition: background 0.3s ease;
        }
        figure:hover {
            background: rgba(0, 123, 255, 0.30);
        }
        blockquote {
            font-style: italic;
            color: #444;
            margin: 0 0 15px;
        }
        figcaption {
            font-weight: bold;
            color: #222;
        }
        footer {
            text-align: center;
            background: #222;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <section>
        <h2>What Our Clients Say</h2>
        <div class="testimonials">
            <figure>
                <blockquote>
                    "The service was excellent! I highly recommend this company."
                </blockquote>
                <figcaption>— John Smith</figcaption>
            </figure>
            <figure>
                <blockquote>
                    "Amazing experience from start to finish. Great support team!"
                </blockquote>
                <figcaption>— Sarah Johnson</figcaption>
            </figure>
            <figure>
                <blockquote>
                    "Professional, reliable, and exceeded all my expectations."
                </blockquote>
                <figcaption>— David Brown</figcaption>
            </figure>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 Testimonials Section. All Rights Reserved.</p>
    </footer>
</body>
</html>
