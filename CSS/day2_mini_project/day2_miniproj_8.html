<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Mini Project 8</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333333;
        }
        section {
            background: #ffffff;
            margin: 20px auto;
            padding: 15px;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 10px;
            color: #444444;
        }
        .progress-container {
            width: 100%;
            background: #dddddd;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 25px;
            line-height: 25px;
            text-align: center;
            color: white;
            font-weight: bold;
            background: linear-gradient(to right, #4CAF50, #81C784);
            transition: 0.3s ease;
        }
        .progress-bar:hover {
            background: linear-gradient(to right, #ff9800, #ffc107);
            color: #000000;
        }
        .html { width: 90%; }
        .css { width: 80%; }
        .javascript { width: 70%; }
    </style>
</head>
<body>
    <h1>Skills Progress</h1>
    <section>
        <h2>HTML</h2>
        <div class="progress-container">
            <div class="progress-bar html">90%</div>
        </div>
    </section>
    <section>
        <h2>CSS</h2>
        <div class="progress-container">
            <div class="progress-bar css">80%</div>
        </div>
    </section>
    <section>
        <h2>JavaScript</h2>
        <div class="progress-container">
            <div class="progress-bar javascript">70%</div>
        </div>
    </section>
</body>
</html>
