<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        .gallery {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .image {
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .image img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease, filter 0.4s ease;
        }
        .image:hover img {
            transform: scale(1.1);
            filter: grayscale(60%);
        } 
        /* Tablet - 2 Columns */
        @media (min-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Desktop - 4 Columns */
        @media (min-width: 1024px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
            }
        }       
    </style>
</head>
<body>

    <h1>Responsive Image Gallery</h1>

    <div class="gallery">
        <div class="image">
            <img src="https://picsum.photos/id/1015/600/400" alt="Nature 1">
        </div>

        <div class="image">
            <img src="https://picsum.photos/id/1016/600/400" alt="Nature 2">
        </div>

        <div class="image">
            <img src="https://picsum.photos/id/1025/600/400" alt="Nature 3">
        </div>

        <div class="image">
            <img src="https://picsum.photos/id/1035/600/400" alt="Nature 4">
        </div>

        <div class="image">
            <img src="https://picsum.photos/id/1043/600/400" alt="Nature 5">
        </div>

        <div class="image">
            <img src="https://picsum.photos/id/1050/600/400" alt="Nature 6">
        </div>

        <div class="image">
            <img src="https://picsum.photos/id/1060/600/400" alt="Nature 7">
        </div>

        <div class="image">
            <img src="https://picsum.photos/id/1074/600/400" alt="Nature 8">
        </div>
    </div>

</body>
</html>
