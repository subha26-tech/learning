<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Pricing Table</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pricing-container {
            width: 100%;
            max-width: 1100px;  
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: stretch;
        }
        .pricing-card {
            flex: 1;
            background-color: white;
            padding: 35px 25px;
            text-align: center;
            border-radius: 15px;
        }
        .pricing-card h2 {
            margin-bottom: 15px;
            color: #333333;
        }
        .price {
            font-size: 35px;
            font-weight: bold;
            color: #222222;
            margin-bottom: 20px;
        }
        .pricing-card ul {
            list-style: none;
            margin-bottom: 25px;
        }
        .pricing-card li {
            padding: 8px;
            color: #555555;
            border-bottom: 1px solid #e5e7eb;
        }
        .btn{
            margin-top:20px;
            padding:10px 25px;
            border:none;
            border-radius:20px;
            background:#4601f5;
            color:white;
            cursor:pointer;
            font-size:16px;
        }
        .featured {
            flex-grow: 1.4;
        }
        .selected {
            color: white;
            border: none;
            background: linear-gradient(135deg, #c162e7, #8b5cf6);
            box-shadow: 2px 18px 40px rgba(99, 102, 241, 0.35);
            transform: translateY(-10px);
        }
        .pricing-card:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }
        @media (max-width: 768px) {
            .pricing-container {
                flex-direction: column;
                align-items: center;
            }
            .featured {
                flex-grow: 1;
            }
        }
    </style>
</head>

<body>
    <div class="pricing-container">
        <div class="pricing-card">
            <h2>Basic</h2>
            <div class="price">$10</div>
            <ul>
                <li>✔ 5 GB Storage</li>
                <li>✔ Email Support</li>
                <li>✔ 1 User</li>
            </ul>
            <button class="btn">Choose Plan</button>
        </div>
        <div class="pricing-card featured selected">
            <h2>Pro</h2>
            <div class="price">$25</div>
            <ul>
                <li>✔ 50 GB Storage</li>
                <li>✔ Priority Support</li>
                <li>✔ 5 Users</li>
            </ul>
            <button class="btn">Choose Plan</button>
        </div>
        <div class="pricing-card">
            <h2>Premium</h2>
            <div class="price">$50</div>
            <ul>
                <li>✔ Unlimited Storage</li>
                <li>✔ 24/7 Support</li>
                <li>✔ Unlimited Users</li>
            </ul>
            <button class="btn">Choose Plan</button>
        </div>
    </div>
</body>
</html>
