<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Product</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 10px 20px 25px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin: 0 0 20px;
        }
        .product-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            flex: 1 1 300px;
            min-height: 318px;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }
        .product-card.featured {
            flex-grow: 1.5;
        }
        .product-image {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            min-height: 220px;
        }
        .product-image img {
            max-width: 100%;
            max-height: 180px;
        }
        .product-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 0 15px 18px;
            text-align: center;
        }
        .product-title {
            margin: 0 0 5px;
            font-size: 18px;
            font-weight: bold;
        }
        .product-description {
            margin: 0 0 6px;
            color: #777;
            font-size: 16px;
        }
        .product-price {
            margin: 0;
            color: #e64a2e;
            font-size: 18px;
            font-weight: bold;
        }
        /* Responsive layout */
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }
            .product-card,
            .product-card.featured {
                flex: 1 1 100%;
            }
            .product-image {
                min-height: 180px;
            }
        }

        @media (min-width: 701px) and (max-width: 950px) {
            .product-card,
            .product-card.featured {
                flex: 1 1 calc(50% - 10px);
            }
        }
    </style>
</head>

<body>
    <h1>Our Products</h1>
    <div class="product-grid">
        <article class="product-card featured">
            <div class="product-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDTmVqjkAkxpxoLeZxEakpOOLM8Jqq8y-rFdVK1dT2QA&s=10" alt="Featured Headphones">
            </div>

            <div class="product-info">
                <h2 class="product-title">Featured Headphones</h2>
                <p class="product-description">
                    High-quality sound with noise cancellation.
                </p>
                <p class="product-price">₹1999</p>
            </div>
        </article>
        <article class="product-card">
            <div class="product-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbYh4k2tqDa1L7LI5AE-zPg4ed1yCui5pKtvB_ZQR6xA&s" alt="Wireless Earbuds">
            </div>

            <div class="product-info">
                <h2 class="product-title">Wireless Earbuds</h2>
                <p class="product-description">
                    Compact and powerful sound.
                </p>
                <p class="product-price">₹799</p>
            </div>
        </article>
        <article class="product-card">
            <div class="product-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPL2Xq8dKg609sgrVxY3UanNuCfZYszznbUP6UjibCbw&s=10" alt="Smart Watch">
            </div>

            <div class="product-info">
                <h2 class="product-title">Smart Watch</h2>
                <p class="product-description">
                    Track fitness and notifications.
                </p>
                <p class="product-price">₹1999</p>
            </div>
        </article>
    </div>
</body>
</html>
