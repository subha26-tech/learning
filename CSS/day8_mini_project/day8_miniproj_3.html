<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Card Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: auto;
            align-items: flex-start;
        }
        .card {
            flex-basis: 300px;
            flex-grow: 1;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
        }
        .card h2 {
            margin-bottom: 10px;
            color: #222;
        }
        .card p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .card button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        .card button:hover {
            background-color: #0056b3;
        }
        .card:nth-child(2) {
            align-self: center;
        }
        /* Responsive design */
        @media (max-width: 650px) {
            body {
                padding: 15px;
            }

            .card {
                flex-basis: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Card Layout</h1>
    <div class="card-container">
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0DrDZTxSjqrzwpnzrnlGMDIqn7niNtdehawhdgOeXpg&s=10" alt="Nature">
            <div class="card-content">
                <h2>Nature</h2>
                <p>Explore beautiful landscapes and discover the wonders of nature.</p>
                <button>Read More</button>
            </div>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBcXncPRRoyJgFxevdYTGwf5PRwX_ftt4saYZswfMdzQ&s=10" alt="Travel">
            <div class="card-content">
                <h2>Travel</h2>
                <p>Discover exciting destinations and plan your next adventure.</p>
                <button>Read More</button>
            </div>
        </div>
    </div>
</body>
</html>
