<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Section</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }
        .container{
            background-color: white;
            border-radius: 15px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
            width: 100%;
        }

        .feature {
            flex: 1 1 320px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* First column takes more available space */
        .feature.feature-large {
            flex-grow: 1.5;
        }

        .icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8f0ff;
            color: #2563eb;
            border-radius: 50%;
            font-size: 24px;
            align-self: center;
        }
        img{
            width: 50px;
            height: 50px;
        }

        .feature h3 {
            margin: 0;
            font-size: 22px;
        }

        .feature p {
            margin: 0;
            line-height: 1.6;
            color: #666;
        }

        @media (max-width: 700px) {
            .feature,
            .feature.feature-large {
            flex-grow: 1;
            flex-basis: 100%;
            }
        }
    </style>
</head>

<body>

    <section class="container">
        <h1>Our Features</h1>
        <div class="features">
            <div class="feature feature-large">
                <div class="icon">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTA8P-vUgDR354cqIle8JTr0djAbJE7mwUxERbT1Vh24w&s=10" alt="Feature 1">
                </div>
                <h3>Fast Performance</h3>
                <p>Experience lightning-fast load times.</p>
            </div>

            <div class="feature">
                <div class="icon">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqembTMtugdnJIaEHxBzj-iETWH6JDF8PRQKcOyGMlWg&s=10" alt="Feature 1">
                </div>
                <h3>Secure Platform</h3>
                <p>Enhanced security to protect your data.</p>
            </div>

            <div class="feature">
                <div class="icon">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBPdRHQ2ZyjNvWky4hSmpAo0KsKQbZsrruycBYRLjvpQ&s=10" alt="Feature 1">
                </div>
                <h3>Easy Integration</h3>
                <p>Seamless integration with your tools.</p>
            </div>
        </div>
    </section>

</body>
</html>
